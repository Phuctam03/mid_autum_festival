
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#08071d" />
  <title>Đêm Hội Trăng Rằm — Vietnamese Mid-Autumn Festival</title>
  <meta name="description" content="Enter an immersive Vietnamese Mid-Autumn Festival night of moonlight, lanterns, fireworks, and memories." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky-canvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main id="experience">
    <section id="hero" class="scene hero-scene" aria-labelledby="festival-title">
      <div class="sky-wash"></div>
      <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="cloud cloud-c"></div>
      <button id="hero-moon" class="moon hero-moon" type="button" aria-label="Touch the full moon">
        <span class="moon-crater crater-a"></span><span class="moon-crater crater-b"></span><span class="moon-crater crater-c"></span>
      </button>
      <div id="hero-lanterns" class="lantern-layer" aria-hidden="true"></div>
      <div class="horizon" aria-hidden="true">
        <span class="roof roof-left"></span><span class="roof roof-center"></span><span class="roof roof-right"></span>
      </div>

      <div class="hero-content">
        <p class="eyebrow">TẾT TRUNG THU · 2026</p>
        <h1 id="festival-title">Happy Mid-Autumn Festival</h1>
        <p class="subtitle">Đêm hội trăng rằm</p>
        <div class="title-ornament"><span></span><i>✦</i><span></span></div>
        <button id="enter-button" class="portal-button" type="button">
          <span class="portal-ring" aria-hidden="true"></span>
          <span class="portal-label">Enter the festival</span>
          <i aria-hidden="true">↗</i>
        </button>
        <p class="invitation">Nhấn nút vàng bên dưới để bước vào đêm hội</p>
      </div>

      <div class="scroll-mark" aria-hidden="true"><span></span><small>CHẠM VÀO ÁNH TRĂNG</small></div>
    </section>

    <section id="festival-world" class="scene world-scene" aria-hidden="true">
      <div id="three-stage" aria-label="Interactive floating festival gallery"></div>
      <header class="world-header">
        <div class="brand-mark"><span class="brand-star">★</span><div><b>TRUNG THU</b><small>Đêm hội trăng rằm</small></div></div>
        <div class="world-label"><span>MEMORIES IN MOONLIGHT</span><small>Move to explore · Select a memory</small></div>
      </header>
      <div id="caption-card" class="caption-card" aria-live="polite"><span>01</span><div><small>TRUNG THU MEMORY</small><strong>Lanterns by Hoàn Kiếm</strong></div></div>
      <div class="world-hint">DRAG TO ORBIT <span>·</span> TAP THE MOON</div>
    </section>
  </main>

  <button id="sound-button" class="sound-button" type="button" aria-label="Play festival music" title="Play festival music">
    <span class="sound-disc"><i></i></span><span class="sound-state">SOUND OFF</span>
  </button>
  <audio id="festival-audio" loop preload="none"><source src="audio/mid-autumn.mp3" type="audio/mpeg" /></audio>

  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Festival memory viewer" hidden>
    <button id="viewer-close" class="icon-button close-button" type="button" aria-label="Close viewer">×</button>
    <button id="viewer-prev" class="icon-button viewer-arrow viewer-prev" type="button" aria-label="Previous photo">‹</button>
    <figure><img id="viewer-image" src="" alt="" /><figcaption><span id="viewer-index"></span><div><small>TRUNG THU MEMORY</small><strong id="viewer-caption"></strong></div></figcaption></figure>
    <button id="viewer-next" class="icon-button viewer-arrow viewer-next" type="button" aria-label="Next photo">›</button>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script>
    if (!window.gsap) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script>');
    }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
